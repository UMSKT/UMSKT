name: Windows ARM

on:
  push:
    branches: [ "*" ]
    paths-ignore: [ '**.md', 'doc/**', '.idea/**'] # If only these files are edited, skip
  pull_request: 
    branches: [ "*" ]
    paths-ignore: [ '**.md', 'doc/**', '.idea/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
        fail-fast: false
        matrix:
            include:
           #   - arch: arm32
           #     arch_compilename: amd64_arm
           #     cmake_arch: ARM
              - arch: arm64
                arch_compilename: amd64_arm64
                cmake_arch: ARM64
    steps:
      - name: Setup MSVC for ${{ matrix.arch }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch_compilename }}

      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Configure UMSKT
        shell: pwsh
        run: |
          cmake -G "Visual Studio 18 2026" `
            -A ${{ matrix.cmake_arch }} `
            -DWINDOWS_ARM=ON `
            -DCMAKE_POLICY_VERSION_MINIMUM="3.5" `
            .

      - name: Build UMSKT
        shell: pwsh
        run: |
          cmake --build . --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: UMSKT-WinNT-${{ matrix.arch }}
          path: Release/umskt.exe

  test-arm64:
    needs: build
    if: success()
    runs-on: windows-11-arm
    strategy:
      matrix:
        arch: [arm64]
    steps:
      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: UMSKT-WinNT-${{ matrix.arch }}
          path: .

      - name: Run tests
        shell: pwsh
        run: |
          Write-Host Test 1 - generating key `(BINK1998`)
          .\umskt.exe -b 2C -c 365 -s 069420,999999 -v
          Write-Host Test 2 - generating key `(BINK2002`)
          .\umskt.exe -b 5A -c 640 -s 069420,999999 -v
          Write-Host Test 3 - generatng confid
          .\umskt.exe -i 253286028742154311079061239762245184619981623171292574 
